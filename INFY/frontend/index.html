<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BillSphere</title>
    <!-- Prevent flash of unstyled content: initialize theme before React renders -->
    <script>
      (function() {
        const theme = localStorage.getItem('billsphere-theme') || 'ledger';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const mode = localStorage.getItem('billsphere-mode') || (prefersDark ? 'dark' : 'light');
        
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-mode', mode);
        if (mode === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
