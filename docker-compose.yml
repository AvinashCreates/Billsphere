services:

  redis:
    image: redis:7-alpine
    container_name: billing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: billing-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis

  celery_beat:
    build: .
    container_name: billing-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis